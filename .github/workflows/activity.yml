name: Update live activity feed

on:
  schedule:
    - cron: "30 18 * * *"   # every day at 00:00 IST
    - cron: "30 6 * * *"    # and at 12:00 IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build activity panels from real GitHub data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/activity.py assets
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity.svg assets/activity-m.svg
          git diff --cached --quiet || (git commit -m "Update live activity feed" && git push)
